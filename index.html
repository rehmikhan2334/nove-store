  <title>NOVA Store — Shop modern essentials</title>

  <style>
/* ============ NOVA Store — modern theme ============ */
:root {
  --primary: #ff4d2e;
  --primary-600: #e63a1c;
  --accent: #ff2e63;
  --grad: linear-gradient(135deg, #ff7a2e 0%, #ff4d2e 45%, #ff2e63 100%);
  --ink: #0e0f13;
  --bg: #f7f6f3;
  --surface: #ffffff;
  --surface-2: #f1f5f9;
  --text: #121317;
  --muted: #64748b;
  --border: #e2e8f0;
  --success: #16a34a;
  --danger: #ef4444;
  --warn: #f59e0b;
  --radius: 16px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, .06);
  --shadow: 0 8px 30px rgba(15, 23, 42, .08);
  --shadow-lg: 0 20px 50px rgba(255, 77, 46, .18);
  --footer-bg: #0e0f13;
}
[data-theme='dark'] {
  --bg: #0c0d10;
  --surface: #15161b;
  --surface-2: #1d1f26;
  --text: #f1f1f3;
  --muted: #9a9ca8;
  --border: #2a2c35;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow: 0 8px 30px rgba(0, 0, 0, .35);
  --footer-bg: #08090b;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.6;
  -webkit-font-smoothing: antialiased; transition: background .25s, color .25s;
}
h1, h2, h3, h4 { font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; line-height: 1.2; letter-spacing: -.02em; }
h1 { font-size: clamp(1.8rem, 4vw, 2.5rem); font-weight: 800; }
h2 { font-size: clamp(1.4rem, 3vw, 1.9rem); font-weight: 800; }
h3 { font-size: 1.1rem; font-weight: 700; }
h4 { font-size: .95rem; font-weight: 700; }
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
input, select, textarea { font: inherit; color: inherit; }
img { display: block; max-width: 100%; }
ul { list-style: none; }
s { color: var(--muted); font-weight: 400; }

.container { width: 100%; max-width: 1240px; margin: 0 auto; padding: 0 20px; }
.page { padding-top: 24px; padding-bottom: 64px; min-height: 70vh; }
.section { padding-top: 56px; }
.center { text-align: center; display: flex; justify-content: center; }
.muted { color: var(--muted); }
.ok { color: var(--success); }
.err { color: var(--danger); font-size: .8rem; }
.grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* ---- Buttons ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 20px; border-radius: 12px; font-weight: 600; font-size: .95rem;
  transition: transform .15s, box-shadow .2s, background .2s, border-color .2s; white-space: nowrap;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn-primary { background: var(--grad); color: #fff; box-shadow: 0 6px 18px rgba(255, 77, 46, .35); }
.btn-primary:hover { box-shadow: 0 10px 26px rgba(255, 77, 46, .5); }
.btn-dark { background: var(--text); color: var(--bg); }
.btn-outline { border: 1.5px solid var(--border); background: var(--surface); }
.btn-outline:hover { border-color: var(--primary); color: var(--primary); }
.btn-ghost { background: var(--surface-2); }
.btn-ghost:hover { background: var(--border); }
.btn-light { background: #fff; color: #121317; }
.btn-sm { padding: 8px 14px; font-size: .85rem; border-radius: 10px; }
.btn-lg { padding: 14px 26px; font-size: 1rem; border-radius: 14px; }
.btn-block { width: 100%; }

.icon-btn {
  position: relative; display: inline-grid; place-items: center; width: 42px; height: 42px;
  border-radius: 12px; font-size: 1.15rem; transition: background .2s, color .2s;
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn.big { width: 52px; height: 52px; border: 1.5px solid var(--border); font-size: 1.4rem; }
.icon-btn.active { color: #ec4899; }
.with-count i {
  position: absolute; top: 2px; right: 0; min-width: 18px; height: 18px; padding: 0 5px;
  background: var(--grad); color: #fff; border-radius: 99px; font-size: .68rem; font-style: normal;
  font-weight: 700; display: grid; place-items: center;
}

/* ---- Header ---- */
.site-header { position: sticky; top: 0; z-index: 50; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
.topbar { background: var(--grad); color: #fff; font-size: .8rem; }
.topbar-in { display: flex; justify-content: space-between; padding: 7px 20px; }
.nav { display: flex; align-items: center; gap: 20px; padding-top: 14px; padding-bottom: 14px; }
.logo { display: inline-flex; align-items: center; gap: 10px; font-family: 'Plus Jakarta Sans'; font-weight: 800; font-size: 1.4rem; letter-spacing: .02em; }
.logo-mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 11px; background: var(--grad); color: #fff; font-size: 1.15rem; box-shadow: 0 6px 14px rgba(255, 77, 46, .4); }
.logo.light { color: #fff; }
.search-box { flex: 1; max-width: 560px; display: flex; background: var(--surface-2); border: 1.5px solid transparent; border-radius: 14px; overflow: hidden; transition: border-color .2s, background .2s; }
.search-box:focus-within { border-color: var(--primary); background: var(--surface); }
.search-box input { flex: 1; border: 0; background: none; padding: 11px 16px; outline: none; min-width: 0; }
.search-box button { padding: 0 16px; }
.nav-actions { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.menu-btn { display: none; }
.main-nav { border-top: 1px solid var(--border); }
.main-nav-in { display: flex; gap: 6px; padding-top: 4px; padding-bottom: 4px; overflow-x: auto; }
.main-nav a { padding: 10px 14px; border-radius: 10px; font-size: .9rem; font-weight: 500; color: var(--muted); white-space: nowrap; transition: color .2s, background .2s; }
.main-nav a:hover { color: var(--text); background: var(--surface-2); }
.main-nav a.active { color: var(--primary); background: color-mix(in srgb, var(--primary) 12%, transparent); font-weight: 600; }

/* ---- Hero ---- */
.hero { position: relative; overflow: hidden; padding: 64px 0 80px; background: radial-gradient(1000px 500px at 85% 0%, rgba(255, 46, 99, .18), transparent 60%), radial-gradient(800px 400px at 0% 100%, rgba(255, 77, 46, .16), transparent 60%); }
.hero-in { display: grid; grid-template-columns: 1.05fr 1fr; align-items: center; gap: 48px; }
.pill { display: inline-block; padding: 6px 14px; border-radius: 99px; background: color-mix(in srgb, var(--primary) 12%, transparent); color: var(--primary); font-weight: 600; font-size: .82rem; margin-bottom: 18px; }
.pill-light { background: rgba(255, 255, 255, .2); color: #fff; }
.hero h1 { font-size: clamp(2.2rem, 5.5vw, 3.8rem); margin-bottom: 18px; }
.hero p { font-size: 1.1rem; color: var(--muted); max-width: 520px; margin-bottom: 28px; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; }
.hero-cta.center { justify-content: center; margin-top: 24px; }
.hero-stats { display: flex; gap: 36px; margin-top: 40px; }
.hero-stats b { display: block; font-family: 'Plus Jakarta Sans'; font-size: 1.6rem; }
.hero-stats span { color: var(--muted); font-size: .85rem; }
.hero-visual { position: relative; display: grid; place-items: center; }
.hero-blob { position: absolute; width: 88%; aspect-ratio: 1; background: var(--grad); border-radius: 42% 58% 55% 45% / 50% 45% 55% 50%; opacity: .9; animation: morph 9s ease-in-out infinite; filter: blur(1px); }
@keyframes morph { 50% { border-radius: 58% 42% 45% 55% / 45% 55% 45% 55%; transform: rotate(6deg); } }
.hero-img { position: relative; width: 78%; aspect-ratio: 1; object-fit: cover; border-radius: 28px; box-shadow: var(--shadow-lg); transform: rotate(-3deg); }
.hero-float { position: absolute; left: 0; bottom: 8%; background: var(--surface); padding: 14px 18px; border-radius: 16px; box-shadow: var(--shadow); display: grid; gap: 2px; animation: float 4s ease-in-out infinite; }
.hero-float small { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; }
.hero-float span { color: var(--primary); font-weight: 700; font-size: .9rem; }
@keyframes float { 50% { transform: translateY(-10px); } }

/* ---- Sections ---- */
.section-head { display: flex; justify-content: space-between; align-items: end; margin-bottom: 24px; }
.section-head a { color: var(--primary); font-weight: 600; font-size: .9rem; }
.cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
.cat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 26px; transition: transform .25s, box-shadow .25s, border-color .25s; }
.cat-card:hover { transform: translateY(-6px); box-shadow: var(--shadow); border-color: var(--primary); }
.cat-icon { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 16px; background: color-mix(in srgb, var(--primary) 12%, transparent); font-size: 1.7rem; margin-bottom: 14px; }
.cat-card p { color: var(--muted); font-size: .88rem; margin: 4px 0 12px; }
.cat-card em { color: var(--primary); font-style: normal; font-weight: 600; font-size: .88rem; }
.promo { margin-top: 64px; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 44px; border-radius: 24px; background: var(--grad); color: #fff; position: relative; overflow: hidden; }
.promo::after { content: ''; position: absolute; right: -60px; top: -80px; width: 280px; height: 280px; border-radius: 50%; background: rgba(255, 255, 255, .12); }
.promo h2 { margin-bottom: 8px; font-size: clamp(1.5rem, 3vw, 2.2rem); }
.promo p { opacity: .92; }
.testi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.testi { padding: 26px; }
.stars { color: #f59e0b; letter-spacing: 2px; }
.testi blockquote { margin: 12px 0 18px; color: var(--muted); }
.testi figcaption { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.avatar { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--grad); color: #fff; font-weight: 700; }

/* ---- Cards & grid ---- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.product-card { overflow: hidden; display: flex; flex-direction: column; transition: transform .25s, box-shadow .25s; }
.product-card:hover { transform: translateY(-6px); box-shadow: var(--shadow); }
.pc-media { position: relative; aspect-ratio: 1; background: var(--surface-2); overflow: hidden; }
.pc-media img, .img-fallback { width: 100%; height: 100%; object-fit: cover; transition: transform .5s; }
.product-card:hover .pc-media img { transform: scale(1.07); }
.img-fallback { display: grid; place-items: center; font-size: 4rem; background: linear-gradient(135deg, color-mix(in srgb, var(--primary) 18%, var(--surface-2)), color-mix(in srgb, var(--accent) 22%, var(--surface-2))); }
.badge { position: absolute; top: 12px; left: 12px; background: var(--text); color: var(--bg); font-size: .7rem; font-weight: 700; padding: 4px 10px; border-radius: 99px; letter-spacing: .02em; }
.badge-sale { left: auto; right: 56px; background: var(--danger); color: #fff; top: 12px; }
.pc-heart { position: absolute; top: 8px; right: 8px; background: var(--surface); box-shadow: var(--shadow-sm); width: 38px; height: 38px; }
.pc-body { padding: 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.pc-cat { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--primary); font-weight: 700; }
.pc-title { font-weight: 600; line-height: 1.35; transition: color .2s; }
.pc-title:hover { color: var(--primary); }
.rating { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; }
.rating .stars { font-size: .85rem; letter-spacing: 1px; }
.pc-foot { margin-top: auto; padding-top: 10px; display: flex; align-items: center; justify-content: space-between; }
.price { display: flex; align-items: baseline; gap: 8px; }
.price strong { font-family: 'Plus Jakarta Sans'; font-size: 1.2rem; }
.price-lg strong { font-size: 2rem; }
.price-lg { margin: 14px 0; }
.save { background: color-mix(in srgb, var(--success) 14%, transparent); color: var(--success); font-weight: 700; font-size: .8rem; padding: 3px 10px; border-radius: 99px; }

/* ---- Page header ---- */
.breadcrumb { font-size: .85rem; color: var(--muted); margin-bottom: 14px; }
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb b { color: var(--text); font-weight: 600; }
.page-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin: 6px 0 24px; flex-wrap: wrap; }
.toolbar { display: flex; gap: 10px; }
select, .field input, .field textarea, .promo-form input {
  background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; padding: 10px 14px; outline: none; transition: border-color .2s, box-shadow .2s;
}
select:focus, .field input:focus, .field textarea:focus, .promo-form input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 15%, transparent); }

/* ---- Shop ---- */
.shop-layout { display: grid; grid-template-columns: 260px 1fr; gap: 28px; align-items: start; }
.filters { padding: 22px; position: sticky; top: 150px; }
.filter-group { padding-bottom: 18px; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
.filter-group h4 { margin-bottom: 12px; }
.radio { display: flex; align-items: center; gap: 10px; padding: 5px 0; cursor: pointer; font-size: .92rem; }
.radio input { accent-color: var(--primary); width: 16px; height: 16px; }
input[type='range'] { width: 100%; accent-color: var(--primary); }
.filter-toggle { display: none; }
.empty { text-align: center; padding: 64px 24px; display: grid; gap: 12px; justify-items: center; }
.empty > span { font-size: 3.5rem; }

/* ---- Search ---- */
.search-hero { padding: 32px; margin-bottom: 20px; display: grid; gap: 16px; background: linear-gradient(135deg, color-mix(in srgb, var(--primary) 10%, var(--surface)), var(--surface)); }
.search-big { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 2px solid var(--border); border-radius: 16px; padding: 4px 14px; transition: border-color .2s; }
.search-big:focus-within { border-color: var(--primary); }
.search-big input { flex: 1; border: 0; background: none; padding: 14px 4px; font-size: 1.1rem; outline: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { padding: 7px 14px; border-radius: 99px; border: 1.5px solid var(--border); background: var(--surface); font-size: .85rem; font-weight: 500; transition: all .2s; }
.chip:hover { border-color: var(--primary); color: var(--primary); }
.chip.on { background: var(--primary); border-color: var(--primary); color: #fff; }
.results-count { margin-bottom: 16px; }

/* ---- Product detail ---- */
.detail { display: grid; grid-template-columns: 1fr 1fr; gap: 44px; }
.detail-media { position: relative; overflow: hidden; aspect-ratio: 1; align-self: start; }
.detail-media img, .detail-media .img-fallback { width: 100%; height: 100%; object-fit: cover; }
.detail-media .badge { top: 18px; left: 18px; font-size: .8rem; padding: 6px 14px; }
.detail-info h1 { margin: 6px 0 10px; }
.lead { color: var(--muted); font-size: 1.02rem; margin-bottom: 22px; }
.opt { display: flex; align-items: center; gap: 18px; margin-bottom: 18px; flex-wrap: wrap; }
.opt h4 { min-width: 70px; }
.swatches { display: flex; gap: 10px; }
.swatch { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--border); box-shadow: inset 0 0 0 3px var(--surface); transition: transform .15s; }
.swatch:hover { transform: scale(1.12); }
.swatch.on { border-color: var(--primary); }
.qty { display: inline-flex; align-items: center; border: 1.5px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--surface); }
.qty button { width: 40px; height: 40px; font-size: 1.2rem; transition: background .2s; }
.qty button:hover { background: var(--surface-2); }
.qty span { min-width: 40px; text-align: center; font-weight: 600; }
.qty.sm button { width: 32px; height: 32px; }
.stock { color: var(--success); font-size: .88rem; font-weight: 600; }
.stock.low { color: var(--danger); }
.detail-cta { display: flex; gap: 12px; margin: 26px 0; flex-wrap: wrap; align-items: center; }
.trust { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; font-size: .85rem; color: var(--muted); padding-top: 18px; border-top: 1px solid var(--border); }
.tabs { margin-top: 48px; overflow: hidden; }
.tab-head { display: flex; border-bottom: 1px solid var(--border); background: var(--surface-2); }
.tab-head button { padding: 16px 26px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; transition: all .2s; }
.tab-head button.on { color: var(--primary); border-color: var(--primary); background: var(--surface); }
.tab-body { padding: 26px; color: var(--muted); }
.check li { position: relative; padding: 6px 0 6px 28px; color: var(--text); }
.check li::before { content: '✓'; position: absolute; left: 0; color: var(--success); font-weight: 800; }
.check.light li { color: #e8ecf8; }
.check.light li::before { color: #86efac; }

/* ---- Cart & checkout ---- */
.cart-layout { display: grid; grid-template-columns: 1fr 380px; gap: 28px; align-items: start; }
.cart-list, .checkout-forms { display: grid; gap: 14px; }
.cart-item { display: grid; grid-template-columns: 110px 1fr auto; gap: 18px; padding: 14px; align-items: center; }
.ci-img img, .ci-img .img-fallback { width: 110px; height: 110px; border-radius: 12px; object-fit: cover; font-size: 2rem; }
.ci-info { display: grid; gap: 6px; justify-items: start; }
.ci-info h3:hover { color: var(--primary); }
.ci-price { display: grid; gap: 8px; justify-items: end; }
.ci-price strong { font-size: 1.2rem; font-family: 'Plus Jakarta Sans'; }
.link-danger { color: var(--danger); font-size: .85rem; font-weight: 600; }
.dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border); }
.ship-bar { padding: 14px 18px; font-size: .9rem; }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; margin-top: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--grad); border-radius: 99px; transition: width .4s; }
.summary { padding: 24px; position: sticky; top: 150px; display: grid; gap: 14px; }
.promo-form { display: flex; gap: 8px; }
.promo-form input { flex: 1; min-width: 0; }
.summary dl > div { display: flex; justify-content: space-between; padding: 7px 0; color: var(--muted); }
.summary dl .total { border-top: 1px dashed var(--border); margin-top: 8px; padding-top: 14px; color: var(--text); font-weight: 800; font-size: 1.25rem; font-family: 'Plus Jakarta Sans'; }
.mini-list li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; font-size: .9rem; border-bottom: 1px solid var(--border); }
.mini-list li.total { font-weight: 800; border: 0; font-size: 1.05rem; }
.form-card { padding: 26px; display: grid; gap: 18px; }
.form-grid { display: flex; flex-wrap: wrap; gap: 16px; }
.field { display: grid; gap: 6px; width: 100%; font-size: .88rem; font-weight: 600; }
.field.half { width: calc(50% - 8px); }
.field input.invalid { border-color: var(--danger); }
.field span { color: var(--muted); font-weight: 500; }
.pay-opts { display: flex; gap: 12px; flex-wrap: wrap; }
.pay { flex: 1; min-width: 200px; display: flex; align-items: center; gap: 10px; padding: 14px 16px; border: 1.5px solid var(--border); border-radius: 12px; cursor: pointer; font-weight: 600; transition: all .2s; }
.pay.on { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 8%, transparent); }
.pay input { accent-color: var(--primary); }
.success { max-width: 640px; margin: 24px auto; padding: 44px 32px; text-align: center; display: grid; gap: 12px; justify-items: center; }
.success .mini-list { width: 100%; text-align: left; margin-top: 8px; }
.check-big { display: grid; place-items: center; width: 84px; height: 84px; border-radius: 50%; background: color-mix(in srgb, var(--success) 16%, transparent); color: var(--success); font-size: 2.6rem; font-weight: 800; animation: pop .5s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes pop { from { transform: scale(0); } }

  <script>
/* Small UI helpers: escaping, icons, stars, product card, images */
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function icon(name = 'bag', size = 20, o = {}) {
  const { fill = false, className = '', strokeWidth = 2 } = o;
  return `<svg class="icon ${className}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="${fill ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="${strokeWidth}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ICONS.bag}</svg>`;
}

function stars(value = 5, size = 16) {
  const pts = '12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2';
  let s = '';
  for (let n = 1; n <= 5; n++) s += `<svg width="${size}" height="${size}" viewBox="0 0 24 24" class="${n <= Math.round(value) ? 'on' : ''}" aria-hidden="true"><polygon points="${pts}" /></svg>`;
  return `<span class="stars-svg" role="img" aria-label="${value} out of 5 stars">${s}</span>`;
}

const rating = (value, reviews) =>
  `<span class="rating">${stars(value, 15)}<b>${value.toFixed(1)}</b>${reviews != null ? `<span class="muted">(${reviews})</span>` : ''}</span>`;

const fallbackImg = (alt, ic, cls = '') => `<div class="img-fallback ${cls}" role="img" aria-label="${esc(alt)}">${icon(ic, 64, { strokeWidth: 1.4 })}</div>`;
function safeImage(src, alt, ic = 'bag', cls = '') {
  if (!src) return fallbackImg(alt, ic, cls);
  return `<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy" class="${cls}" data-fb="${ic}">`;
}
// If an image fails to load, swap it for an icon placeholder
document.addEventListener('error', (e) => {
  const img = e.target;
  if (img.tagName !== 'IMG' || !img.dataset.fb) return;
  const d = document.createElement('div');
  d.innerHTML = fallbackImg(img.alt, img.dataset.fb, img.className);
  img.replaceWith(d.firstElementChild);
}, true);

function productCard(p) {
  const liked = Store.wishlist.includes(p.id);
  const discount = p.oldPrice ? Math.round((1 - p.price / p.oldPrice) * 100) : 0;
  const cat = getCategory(p.category);
  return `<article class="card product-card reveal" data-pid="${p.id}">
    <div class="pc-media">
      <a href="#/product/${p.slug}" aria-label="${esc(p.name)}">${safeImage(p.image, p.name, cat && cat.icon)}</a>
      ${p.badge ? `<span class="badge">${p.badge}</span>` : ''}
      ${discount > 0 ? `<span class="badge badge-sale">-${discount}%</span>` : ''}
      <button class="icon-btn pc-heart ${liked ? 'active' : ''}" data-action="wish" data-id="${p.id}" aria-label="Toggle wishlist">${icon('heart', 18, { fill: liked })}</button>
      <div class="pc-hover">
        <button class="pc-tool" data-action="quickview" data-id="${p.id}" aria-label="Quick view">${icon('eye', 17)}<span>Quick view</span></button>
        <button class="pc-tool ${typeof Compare !== 'undefined' && Compare.has(p.id) ? 'on' : ''}" data-action="compare" data-id="${p.id}" aria-label="Compare">${icon('compare', 17)}<span>Compare</span></button>
      </div>
      ${p.stock <= 10 ? `<span class="pc-low">${icon('zap', 12, { fill: true })} Only ${p.stock} left</span>` : ''}
    </div>
    <div class="pc-body">
      <span class="pc-cat">${cat ? cat.name : ''}</span>
      <a href="#/product/${p.slug}" class="pc-title">${esc(p.name)}</a>
      ${rating(p.rating, p.reviews)}
      <div class="pc-foot">
        <div class="price"><strong>${formatPrice(p.price)}</strong>${p.oldPrice ? `<s>${formatPrice(p.oldPrice)}</s>` : ''}</div>
        <button class="btn btn-primary btn-sm" data-action="add" data-id="${p.id}">Add</button>
      </div>
    </div></article>`;
}
const grid = (list, cls = '') => `<div class="grid ${cls}">${list.map(productCard).join('')}</div>`;
const emptyBox = (ic, title, text, btn) =>
  `<div class="empty card"><span class="empty-ic">${icon(ic, 44)}</span><h2>${title}</h2>${text ? `<p class="muted">${text}</p>` : ''}${btn || ''}</div>`;

  </script>
  <script>
/* Store: cart, wishlist, user, orders, theme, reviews (all saved in localStorage) */
const load = (k, fb) => { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : fb; } catch { return fb; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

const Store = {
  cart: load('nova_cart', []),
  wishlist: load('nova_wishlist', []),
  user: load('nova_user', null),
  orders: load('nova_orders', []),
  userReviews: load('nova_reviews', []),
  theme: load('nova_theme', window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'),
  listeners: [],
  on(fn) { this.listeners.push(fn); },
  emit() { this.listeners.forEach((f) => f()); },

  toast(message, type = 'success') {
    const box = document.getElementById('toasts');
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.innerHTML = icon(type === 'success' ? 'check' : 'tag', 16, { strokeWidth: 3 }) + ' ' + esc(message);
    box.appendChild(el);
    setTimeout(() => el.remove(), 2800);
  },

  setTheme(t) { this.theme = t; save('nova_theme', t); document.documentElement.setAttribute('data-theme', t); this.emit(); },
  toggleTheme() { this.setTheme(this.theme === 'light' ? 'dark' : 'light'); },

  addToCart(product, qty = 1, color = null) {
    const key = product.id + '-' + (color || '');
    const found = this.cart.find((i) => i.key === key);
    if (found) found.qty = Math.min(found.qty + qty, product.stock);
    else this.cart.push({ key, id: product.id, qty, color });
    save('nova_cart', this.cart); this.emit();
    this.toast(product.name + ' added to cart');
  },
  updateQty(key, qty) {
    const i = this.cart.find((x) => x.key === key); if (!i) return;
    const p = products.find((x) => x.id === i.id);
    i.qty = Math.max(1, Math.min(qty, p ? p.stock : 99));
    save('nova_cart', this.cart); this.emit();
  },
  removeFromCart(key) { this.cart = this.cart.filter((i) => i.key !== key); save('nova_cart', this.cart); this.emit(); },
  clearCart() { this.cart = []; save('nova_cart', this.cart); this.emit(); },

  toggleWishlist(product) {
    const has = this.wishlist.includes(product.id);
    this.wishlist = has ? this.wishlist.filter((id) => id !== product.id) : [...this.wishlist, product.id];
    save('nova_wishlist', this.wishlist); this.emit();
    this.toast(has ? 'Removed from wishlist' : 'Saved to wishlist', has ? 'info' : 'success');
    return !has;
  },

  cartItems() { return this.cart.map((i) => ({ ...i, product: products.find((p) => p.id === i.id) })).filter((i) => i.product); },
  cartCount() { return this.cartItems().reduce((s, i) => s + i.qty, 0); },
  subtotal() { return this.cartItems().reduce((s, i) => s + i.qty * i.product.price, 0); },

  reviews() { return [...this.userReviews, ...seedReviews]; },
  addReview(r) {
    this.userReviews.unshift({ ...r, id: 'u' + Date.now(), date: new Date().toISOString().slice(0, 10), verified: false });
    save('nova_reviews', this.userReviews); this.toast('Thanks! Your review was posted');
  },

  login(u) { this.user = u; save('nova_user', u); this.emit(); this.toast('Welcome, ' + u.name + '!'); },
  logout() { this.user = null; save('nova_user', null); this.emit(); this.toast('Signed out', 'info'); },

  placeOrder(details) {
    const items = this.cartItems();
    const order = {
      id: 'NV' + Math.floor(100000 + Math.random() * 900000), date: new Date().toISOString(),
      items: items.map((i) => ({ id: i.id, name: i.product.name, qty: i.qty, price: i.product.price })),
      total: details.total, details,
    };
    this.orders.unshift(order); this.cart = [];
    save('nova_orders', this.orders); save('nova_cart', this.cart); this.emit();
    return order;
  },
};

/* App shell: router, header, footer and global click handling */
const Router = {
  routes: [
    [/^\/$/, pageHome], [/^\/shop$/, pageShop], [/^\/search$/, pageSearch], [/^\/product\/([^/]+)$/, pageProduct],
    [/^\/cart$/, pageCart], [/^\/checkout$/, pageCheckout], [/^\/order-success\/([^/]+)$/, pageOrderSuccess],
    [/^\/wishlist$/, pageWishlist], [/^\/login$/, pageAuth], [/^\/about$/, pageAbout], [/^\/contact$/, pageContact],
  ],
  cleanup: null, lastPath: null,
  parse(h = location.hash) { const [path, qs = ''] = (h.slice(1) || '/').split('?'); return { path, q: new URLSearchParams(qs) }; },
  setQuery(obj) {
    const { path, q } = this.parse();
    Object.entries(obj).forEach(([k, v]) => (v ? q.set(k, v) : q.delete(k)));
    const s = q.toString(); location.hash = path + (s ? '?' + s : '');
  },
  render() {
    if (this.cleanup) { this.cleanup(); this.cleanup = null; }
    const { path, q } = this.parse(), fresh = path !== this.lastPath;
    let page = null;
    for (const [re, fn] of this.routes) { const m = path.match(re); if (m) { page = fn(m.slice(1), q, fresh); break; } }
    if (!page) page = pageNotFound();
    const view = $('#view');
    view.innerHTML = page.html;
    if (fresh) { window.scrollTo(0, 0); view.classList.remove('pg-in'); void view.offsetWidth; view.classList.add('pg-in'); }
    this.lastPath = path;
    if (page.mount) this.cleanup = page.mount() || null;
    closeMenu(); updateHeader();
    if (typeof afterRender === 'function') afterRender();
  },
};

/* ---------- Fly to cart ---------- */
const Fly = {
  src: null,
  from(el) { this.src = el; },

    const cart = $('#hdr-cart'); if (!cart) return;
    const bump = () => { cart.classList.remove('bump'); void cart.offsetWidth; cart.classList.add('bump'); };
    if (!src || reduceMotion) return bump();
    const a = src.getBoundingClientRect(), b = cart.getBoundingClientRect();
    if (!a.width) return bump();

    document.body.appendChild(ghost);
    const dx = b.left + b.width / 2 - (a.left + a.width / 2), dy = b.top + b.height / 2 - (a.top + a.height / 2);
    ghost.animate([
      { transform: 'translate(0,0) scale(1)', opacity: 1, borderRadius: '16px' },
      { transform: `translate(${dx * 0.6}px, ${dy * 0.6 - 80}px) scale(.45)`, opacity: 1, offset: 0.6, borderRadius: '50%' },
      { transform: `translate(${dx}px, ${dy}px) scale(.08)`, opacity: 0.4, borderRadius: '50%' },

/* ---------- Command palette (Ctrl/⌘ + K) ---------- */
const Palette = {
  open() {
    const m = Modal.open(`<div class="pal"><div class="pal-input">${icon('search', 20)}<input id="pal-q" placeholder="Search products, brands, categories…" autocomplete="off"><kbd>Esc</kbd></div><div class="pal-list" id="pal-list"></div>

/* ---------- Flash sale countdown (ends tonight at midnight) ---------- */
function flashSaleHTML() {
  const deals = products.filter((p) => p.oldPrice).sort((a, b) => (1 - b.price / b.oldPrice) - (1 - a.price / a.oldPrice)).slice(0, 4);
  return `<section class="section container"><div class="flash">
    <div class="flash-head"><div><span class="flash-tag">${icon('zap', 14, { fill: true })} Flash sale</span><h2>Today's hottest deals</h2><p class="muted">Prices reset at midnight — grab them while they last.</p></div>
      <div class="countdown" id="countdown" aria-label="Time left in today's sale">${['Hours', 'Mins', 'Secs'].map((l) => `<div><b data-cd="${l}">00</b><span>${l}</span></div>`).join('<i>:</i>')}</div></div>
    ${grid(deals)}</div></section>`;
}
function mountCountdown() {
  const el = $('#countdown'); if (!el) return;
  const tick = () => {
    const now = new Date(), end = new Date(now); end.setHours(24, 0, 0, 0);
    let s = Math.max(0, Math.floor((end - now) / 1000));
    const v = { Hours: Math.floor(s / 3600), Mins: Math.floor((s % 3600) / 60), Secs: s % 60 };
    Object.entries(v).forEach(([k, n]) => { const b = $(`[data-cd="${k}"]`, el); const t = String(n).padStart(2, '0'); if (b.textContent !== t) { b.textContent = t; b.classList.remove('flip'); void b.offsetWidth; b.classList.add('flip'); } });
  };
  tick(); const t = setInterval(tick, 1000); return () => clearInterval(t);
}

/* ---------- Confetti (order success) ---------- */
function confetti() {
  if (reduceMotion) return;
  const c = document.createElement('canvas'); c.className = 'confetti'; document.body.appendChild(c);
  const ctx = c.getContext('2d'), W = (c.width = innerWidth), H = (c.height = innerHeight);
  const colors = ['#ff4d2e', '#ff2e63', '#ffb020', '#22c55e', '#3b82f6', '#121317'];
  const parts = Array.from({ length: 160 }, () => ({ x: W / 2 + (Math.random() - 0.5) * 200, y: H / 3, vx: (Math.random() - 0.5) * 14, vy: Math.random() * -14 - 4, s: Math.random() * 7 + 4, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, c: colors[(Math.random() * colors.length) | 0] }));
  let f = 0;
  (function loop() {
    ctx.clearRect(0, 0, W, H);
    parts.forEach((p) => { p.vy += 0.35; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (++f < 200) requestAnimationFrame(loop); else c.remove();
  })();
}

/* ---------- Scroll reveal ---------- */
const revealIO = 'IntersectionObserver' in window && !reduceMotion
  ? new IntersectionObserver((ents) => ents.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); revealIO.unobserve(e.target); } }), { rootMargin: '0px 0px -40px 0px', threshold: 0.08 })
  : null;
function afterRender() {
  if (!revealIO) { $$('.reveal').forEach((el) => el.classList.add('in')); return; }
  document.documentElement.classList.add('rv-on');
  $$('.reveal:not(.in)').forEach((el, n) => { el.style.transitionDelay = (n % 4) * 70 + 'ms'; revealIO.observe(el); });
  $$('.section-head, .cat-card, .promo, .stat-strip, .flash-head').forEach((el) => { if (!el.classList.contains('reveal')) { el.classList.add('reveal'); revealIO.observe(el); } });

}

(function scrollUi() {
  const prog = document.createElement('div'); prog.className = 'scroll-prog'; document.body.appendChild(prog);
  const top = document.createElement('button'); top.className = 'to-top'; top.setAttribute('aria-label', 'Back to top'); top.innerHTML = icon('arrowUp', 20);
  top.onclick = () => scrollTo({ top: 0, behavior: 'smooth' }); document.body.appendChild(top);
  let ticking = false;
  addEventListener('scroll', () => {
    if (ticking) return; ticking = true;
    requestAnimationFrame(() => {
      const max = document.documentElement.scrollHeight - innerHeight;
      prog.style.transform = `scaleX(${max > 0 ? scrollY / max : 0})`;
      top.classList.toggle('show', scrollY > 600);
      $('#header') && $('#header').classList.toggle('scrolled', scrollY > 10);
      ticking = false;
    });
  }, { passive: true });
})();

/* ---------- Hooks into the existing store ---------- */
const _addToCart = Store.addToCart.bind(Store);
Store.addToCart = function (product, qty, color) {
  _addToCart(product, qty, color);
  Fly.run();
  const at = location.hash;
  if (!Drawer.isOpen()) setTimeout(() => { if (location.hash === at && !/^#\/(cart|checkout)/.test(at)) Drawer.open(); }, reduceMotion ? 0 : 650);
};
Store.on(() => { if (Drawer.isOpen()) Drawer.render(); });

// remember which image an "Add" click came from (for the fly animation)
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-action=add], #pd-add, #bb-add');
  if (!b) return;
  const card = b.closest('.product-card');
  const src = card ? $('.pc-media img, .pc-media .img-fallback', card) : $('.detail-media img, .detail-media .img-fallback');
  if (src) Fly.from(src);
}, true);

// header cart icon opens the drawer
document.addEventListener('click', (e) => {
  const c = e.target.closest('#hdr-cart');
  if (c && Router.lastPath !== '/cart') { e.preventDefault(); Drawer.open(); }
});

Object.assign(Actions, {
  quickview(el) { quickView(products.find((p) => p.id === +el.dataset.id)); },
  compare(el) { Compare.toggle(+el.dataset.id); },
  'compare-clear'() { Compare.clear(); },
  'compare-open'() { Compare.open(); },
  'modal-close'() { Modal.close(); },
  'drawer-close'(el) { Drawer.close(); if (el.getAttribute('href')) location.hash = el.getAttribute('href'); },
  'dr-qty'(el) { const i = Store.cart.find((x) => x.key === el.dataset.key); if (!i) return; if (i.qty + +el.dataset.d < 1) Store.removeFromCart(i.key); else Store.updateQty(i.key, i.qty + +el.dataset.d); if (Router.lastPath === '/cart') Router.render(); },
  'dr-remove'(el) { Store.removeFromCart(el.dataset.key); if (Router.lastPath === '/cart') Router.render(); },
  palette() { Palette.open(); },
});

document.addEventListener('keydown', (e) => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); Palette.open(); }
  else if (e.key === '/' && !typing) { e.preventDefault(); Palette.open(); }
  else if (e.key === 'Escape') { if (Modal.el) Modal.close(); else if (Drawer.isOpen()) Drawer.close(); }
});
addEventListener('hashchange', () => { Modal.close(true); Drawer.close(); });

/* ---------- Boot ---------- */
buildHeader(); buildFooter(); Router.render(); Compare.render();

  </script>
</body>
